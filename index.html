<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GrowSite - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Brand Logo and Title -->
        <div class="brand">
            <span class="logo">G</span>
            <h1>Grow Site</h1>
            <p class="tagline">CONNECT • CREATE • GROW</p>
        </div>

        <!-- Main Form Container -->
        <div class="form-box">
            <h2 id="formTitle">Welcome Back!</h2>
            <p id="subtitle">Login to your account</p>

            <!-- Status Message Display (For success/error alerts) -->
            <p id="message" style="font-weight: bold; text-align: center; margin: 10px 0;"></p>

            <form id="form">
                <!-- Name Field (Only visible during Sign Up) -->
                <div class="input-field" id="nameField" style="max-height: 0px; overflow: hidden; transition: max-height 0.4s ease;">
                    <input type="text" placeholder="Full Name">
                </div>

                <div class="input-field">
                    <input type="email" placeholder="Email Address" required>
                </div>

                <div class="input-field">
                    <input type="password" id="password" placeholder="Password" required>
                </div>

                <button type="submit" id="submitBtn">LOGIN</button>
                
                <a href="#" class="forgot-pass">Forgot Password?</a>
            </form>

            <div class="divider">
                <span>OR</span>
            </div>

            <!-- Social Login Button -->
            <button class="google-btn">
                <img src="https://wikimedia.org" alt="Google Logo" width="18" style="margin-right: 10px; vertical-align: middle;">
                Continue with Google
            </button>

            <!-- Toggle Switch Between Login and Register -->
            <p class="switch-text">
                <span id="switchMessage">Don't have an account?</span> 
                <button id="switchBtn" style="background: none; border: none; color: #007bff; cursor: pointer; font-weight: bold; text-decoration: underline;">Register here</button>
            </p>
        </div>
    </div>

    <!-- Connecting the JavaScript file -->
    <script type="module" src="script.js"></script>
</body>
              </html>
