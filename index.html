

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#7028d8">
  <title>G Connect</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <h1>G<span>Connect</span></h1>
  <div class="top-actions">
    <button aria-label="Notifications">♡</button>
    <button aria-label="Messages">✉</button>
  </div>
</header>

<main>
  <section class="stories">
    <div class="story">
      <div class="story-ring add">+</div>
      <small>Your story</small>
    </div>
    <div class="story">
      <div class="story-ring"><span>R</span></div>
      <small>Rahul</small>
    </div>
    <div class="story">
      <div class="story-ring"><span>A</span></div>
      <small>Aman</small>
    </div>
    <div class="story">
      <div class="story-ring"><span>S</span></div>
      <small>Simran</small>
    </div>
    <div class="story">
      <div class="story-ring"><span>K</span></div>
      <small>Karan</small>
    </div>
  </section>

  <section class="feed-heading">
    <h2>Discover</h2>
    <span>Explore your community</span>
  </section>

  <article class="post">
    <div class="post-user">
      <div class="avatar">G</div>
      <div>
        <strong>G Connect</strong>
        <small>Official demo account</small>
      </div>
      <button class="more">•••</button>
    </div>

    <div class="post-image">
      <div class="post-art">
        <span>WELCOME TO</span>
        <h2>G CONNECT</h2>
        <p>Connect • Share • Grow</p>
      </div>
    </div>

    <div class="post-actions">
      <button class="like-btn">♡</button>
      <button class="comment-btn">▢</button>
      <button>↗</button>
      <span class="save">♧</span>
    </div>

    <p class="likes"><span class="like-count">0</span> likes</p>
    <p class="caption">
      <strong>gconnect</strong>
      Welcome to our new social community!
    </p>
    <p class="comments" aria-live="polite"></p>
    <form class="comment-form">
      <input type="text" placeholder="Write a comment..." maxlength="200">
      <button type="submit">Post</button>
    </form>
  </article>

  <section class="join-card">
    <h2>Welcome to G Connect!</h2>
    <p>A place to share ideas and connect with people.</p>
    <button onclick="showMessage()">Explore G Connect</button>
  </section>
</main>

<nav class="bottom-nav">
  <button class="active" onclick="showTab('Home')">⌂<small>Home</small></button>
  <button onclick="showTab('Search')">⌕<small>Search</small></button>
  <button onclick="showTab('Create')">＋<small>Create</small></button>
  <button onclick="showTab('Activity')">♡<small>Activity</small></button>
  <button onclick="showTab('Profile')">◉<small>Profile</small></button>
</nav>

<div id="message" class="toast" aria-live="polite"></div>

<script src="script.js"></script>
</body>
</html>
